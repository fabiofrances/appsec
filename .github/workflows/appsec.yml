name: AppSec Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# GITHUB_TOKEN só com leitura; cada job pede o que precisa a mais.
permissions:
  contents: read

# Actions fixadas por SHA (supply chain): a tag fica no comentário e o Dependabot
# (.github/dependabot.yml) abre PR quando sair versão nova.
#
# Quality gates: cada job primeiro gera e publica o relatório (e importa no
# DefectDojo) e só no último passo reprova o pipeline:
#   SAST       Semgrep        achado de severidade ERROR
#   SCA        npm audit      HIGH ou CRITICAL em dependência de produção
#   Container  Trivy          HIGH ou CRITICAL com correção disponível
#   DAST       OWASP ZAP      regra marcada como FAIL em infra/zap/zap-rules.tsv

jobs:
  # ── Unit & Integration Tests ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test -- --passWithNoTests && npm run test:e2e

      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm run test:unit -- --run

  # ── SAST: Semgrep ─────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publica o SARIF na aba Security > Code scanning
    container:
      image: semgrep/semgrep:1.185.0
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
      SEMGREP_RULES: --config p/typescript --config p/nodejs --config p/owasp-top-ten
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan (relatório)
        run: |
          mkdir -p reports
          semgrep scan $SEMGREP_RULES --metrics=off \
            --sarif-output=reports/semgrep.sarif --json-output=reports/semgrep.json

      - name: Upload SARIF (GitHub Code scanning)
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - name: Upload Semgrep report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: reports/semgrep.*

      - name: Import to DefectDojo
        if: env.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT_ID: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
        run: |
          curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=Semgrep JSON Report" \
            -F "product_id=$DEFECTDOJO_PRODUCT_ID" \
            -F "engagement_name=CI - $(date +%Y-%m-%d)" \
            -F "file=@reports/semgrep.json" \
            -F "active=true" \
            -F "verified=false"

      - name: Gate - achados de severidade ERROR
        run: semgrep scan $SEMGREP_RULES --metrics=off --severity ERROR --error

  # ── SCA: OWASP Dependency Check + npm audit ───────────────────────────────
  dependency-check:
    name: Dependency Check (SCA)
    runs-on: ubuntu-latest
    needs: test
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # 1.1.0
        with:
          project: bmi-appsec
          path: .
          format: ALL # JSON/HTML para leitura, XML para o DefectDojo
          args: >
            --enableRetired
            --out reports/dependency-check

      - name: Upload report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: |
            reports/dependency-check/dependency-check-report.json
            reports/dependency-check/dependency-check-report.html
            reports/dependency-check/dependency-check-report.xml

      - name: Import to DefectDojo
        if: env.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT_ID: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
        run: |
          curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=Dependency Check Scan" \
            -F "product_id=$DEFECTDOJO_PRODUCT_ID" \
            -F "engagement_name=CI - $(date +%Y-%m-%d)" \
            -F "file=@reports/dependency-check/dependency-check-report.xml" \
            -F "active=true" \
            -F "verified=false"

      # O Dependency Check lê também as dependências de desenvolvimento e tem falso
      # positivo por CPE: fica como relatório. O gate olha só o que vai para produção.
      - name: Gate - HIGH/CRITICAL em dependências de produção
        run: |
          for app in backend frontend; do
            echo "── $app"
            (cd "$app" && npm audit --omit=dev --audit-level=high)
          done

  # ── Container Scanning: Trivy ─────────────────────────────────────────────
  trivy:
    name: Trivy (Container Scan)
    runs-on: ubuntu-latest
    needs: test
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build -t bmi-backend:ci --target production ./backend

      - name: Build frontend image
        run: docker build -t bmi-frontend:ci --target production ./frontend

      - name: Trivy scan - backend (relatório)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bmi-backend:ci
          format: json
          output: reports/trivy-backend.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Trivy scan - frontend (relatório)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bmi-frontend:ci
          format: json
          output: reports/trivy-frontend.json
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload Trivy reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-reports
          path: reports/trivy-*.json

      - name: Import scans to DefectDojo
        if: env.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT_ID: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
        run: |
          for app in backend frontend; do
            curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
              -H "Authorization: Token $DEFECTDOJO_TOKEN" \
              -F "scan_type=Trivy Scan" \
              -F "product_id=$DEFECTDOJO_PRODUCT_ID" \
              -F "engagement_name=CI - $(date +%Y-%m-%d)" \
              -F "file=@reports/trivy-$app.json" \
              -F "active=true" \
              -F "verified=false"
          done

      # ignore-unfixed: CVE sem correção publicada não bloqueia (não há o que fazer);
      # ela continua no relatório e no DefectDojo para acompanhamento.
      - name: Gate - backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bmi-backend:ci
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Gate - frontend
        if: success() || failure() # roda mesmo se o gate do backend reprovar
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bmi-frontend:ci
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  # ── DAST: OWASP ZAP ───────────────────────────────────────────────────────
  zap:
    name: OWASP ZAP (DAST)
    runs-on: ubuntu-latest
    needs: test
    env:
      DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start application stack
        # só a app (o DAST não precisa da stack do DefectDojo)
        run: |
          docker compose up -d --build frontend backend jaeger
          echo "Waiting for frontend and API..."
          for i in $(seq 1 60); do
            curl -sf http://localhost/ >/dev/null && curl -sf http://localhost/api/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost/api/health

      # Gate: -I não reprova por WARN; reprova só regra marcada como FAIL no zap-rules.tsv.
      - name: Run ZAP full scan
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: http://localhost
          rules_file_name: infra/zap/zap-rules.tsv
          # a action já gera report_json.json, report_html.html e report_md.md na raiz;
          # só acrescentamos o XML (exigido pelo DefectDojo)
          cmd_options: '-x report_xml.xml -I'
          allow_issue_writing: false
          fail_action: true

      - name: Collect ZAP reports
        if: success() || failure()
        run: |
          mkdir -p reports
          for ext in json html xml; do
            [ -f "report_$ext.$ext" ] && cp "report_$ext.$ext" "reports/zap-report.$ext"
          done
          ls -la reports/

      - name: Upload ZAP report
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-report
          path: reports/zap-report.*

      - name: Import to DefectDojo
        if: (success() || failure()) && env.DEFECTDOJO_URL != ''
        env:
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
          DEFECTDOJO_PRODUCT_ID: ${{ secrets.DEFECTDOJO_PRODUCT_ID }}
        run: |
          curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
            -H "Authorization: Token $DEFECTDOJO_TOKEN" \
            -F "scan_type=ZAP Scan" \
            -F "product_id=$DEFECTDOJO_PRODUCT_ID" \
            -F "engagement_name=CI - $(date +%Y-%m-%d)" \
            -F "file=@reports/zap-report.xml" \
            -F "active=true" \
            -F "verified=false"

      - name: Tear down stack
        if: always()
        run: docker compose down
